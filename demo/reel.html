<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nocap reel generator</title>
<style>body{margin:0;background:#111;color:#ddd;font:13px ui-monospace,monospace}</style>
</head>
<body>
<div id="status">rendering…</div>
<script type="module">
/**
 * Kinetic typography reel, every line rendered through the real splitter.
 *
 * The constraint that shapes it: a recording cannot reproduce the effect. At any
 * frame rate a viewer plays this back at, two planes alternating do not fuse
 * into their mean the way they do at a display's refresh rate. Show the planes
 * and it reads as noise. Show the mean and it is ordinary text.
 *
 * So the effect is used as MOTION rather than as flicker. Each line materialises
 * out of its own captured plane and resolves into the mean, which is the same
 * pair of images the technique actually produces, moving between them instead of
 * alternating. Readable at any playback rate, and honest, because both frames
 * come from one splitFrames call.
 *
 * One beat holds on the raw plane on purpose. Screenshot the reel there and you
 * get noise, which is the claim demonstrating itself.
 */
import { splitFrames, perceivedMean } from '../src/splitter.js';

const W = 960, H = 540, FPS = 30;

// Palette is the element's own default, which measures 1.42 masking. A promo
// whose noise does not actually mask would be arguing against itself.
const FG = '#9ea6b4', BG = '#6b7280';

const SCRIPT = [
  { t: 0,   dur: 40,  text: 'Hi',                       size: 74,  move: 'rise' },
  { t: 40,  dur: 55,  text: 'This is nocap',            size: 78,  move: 'resolve' },
  { t: 95,  dur: 38,  text: 'Text',                     size: 92,  move: 'resolve' },
  { t: 133, dur: 45,  text: 'that you cannot',          size: 66,  move: 'slide' },
  { t: 178, dur: 58,  text: 'capture.',                 size: 104, move: 'punch' },
  { t: 236, dur: 60,  text: 'Try taking a picture',     size: 58,  move: 'hold-noise' },
  { t: 296, dur: 58,  text: 'or screen-capture it',     size: 58,  move: 'hold-noise' },
  { t: 354, dur: 62,  text: 'It makes AI scraping',     size: 56,  move: 'resolve' },
  { t: 416, dur: 46,  text: 'hard as well',             size: 68,  move: 'punch' },
  { t: 462, dur: 52,  text: 'hard, not impossible*',    size: 44,  move: 'fade' },
];
const TOTAL = 560;

const cv = document.createElement('canvas');
cv.width = W; cv.height = H;
const g = cv.getContext('2d', { alpha: false, willReadFrequently: true });

const easeOut = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3));
const easeInOut = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5
  ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/**
 * A line, split for real. Returns the plane a capture lands on and the mean a
 * viewer resolves, both from one call so the pair is genuine.
 */
const cache = new Map();
function render(text, size) {
  const key = text + ':' + size;
  if (cache.has(key)) return cache.get(key);

  const pad = 60;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `700 ${size}px Inter, system-ui, -apple-system, sans-serif`;
  const w = Math.min(W - 40, Math.ceil(probe.measureText(text).width) + pad);
  const h = Math.ceil(size * 1.7);

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { alpha: false, willReadFrequently: true });
  x.fillStyle = BG; x.fillRect(0, 0, w, h);
  x.font = `700 ${size}px Inter, system-ui, -apple-system, sans-serif`;
  x.fillStyle = FG;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(text, w / 2, h / 2);

  // Block from the stroke the way resolveOptions derives it: twice the stroke is
  // where a blur stops gaining. Picking one by eye left an earlier cut legible.
  const stroke = Math.max(2, Math.round(size / 8));
  let seed = 9137;
  const rng = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const planes = splitFrames(x.getImageData(0, 0, w, h), {
    mode: 'amplitude', frames: 2, amplitude: 122, hardness: 1,
    noiseScale: stroke * 2, chroma: 0, linearLight: true, gamma: 2.4, rng });

  const toCanvas = (img) => {
    const o = document.createElement('canvas');
    o.width = img.width; o.height = img.height;
    o.getContext('2d').putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
    return o;
  };
  const out = { plane: toCanvas(planes[0]), alt: toCanvas(planes[1]),
                mean: toCanvas(perceivedMean(planes)), w, h };
  cache.set(key, out);
  return out;
}

function frame(f) {
  g.fillStyle = '#111114';
  g.fillRect(0, 0, W, H);

  for (const line of SCRIPT) {
    const local = f - line.t;
    if (local < 0 || local > line.dur) continue;
    const p = local / line.dur;
    const { plane, alt, mean, w, h } = render(line.text, line.size);

    // Every line arrives as a captured plane and resolves into the mean. That is
    // the technique's two outputs, used as motion rather than as flicker.
    let noise = 1 - easeOut(local / 16);
    let dx = 0, dy = 0, scale = 1, alpha = easeOut(local / 8);

    if (line.move === 'rise') dy = (1 - easeOut(local / 18)) * 40;
    if (line.move === 'slide') dx = (1 - easeOut(local / 20)) * -70;
    if (line.move === 'punch') scale = 0.86 + easeOut(local / 14) * 0.14;
    if (line.move === 'fade') alpha = easeInOut(local / 20) * 0.85;
    if (line.move === 'hold-noise') {
      // Held on the raw plane, so a screenshot taken here gets noise. The claim
      // demonstrating itself is worth more than another line of copy.
      noise = local < line.dur - 14 ? 1 : 1 - easeOut((local - (line.dur - 14)) / 12);
    }
    // Out.
    if (local > line.dur - 10) alpha *= easeOut((line.dur - local) / 10);

    const cx = W / 2, cy = H / 2;
    g.save();
    g.globalAlpha = Math.max(0, Math.min(1, alpha));
    g.translate(cx + dx, cy + dy);
    g.scale(scale, scale);
    // Alternate the plane while it is showing, so the noisy state is a real
    // capture rather than one frozen frame.
    const noisy = (f >> 1) % 2 ? plane : alt;
    if (noise > 0.02) {
      g.globalAlpha *= 1;
      g.drawImage(noisy, -w / 2, -h / 2);
    }
    if (noise < 0.98) {
      g.globalAlpha = Math.max(0, Math.min(1, alpha)) * (1 - noise);
      g.drawImage(mean, -w / 2, -h / 2);
    }
    g.restore();
  }

  // Sign-off.
  if (f > TOTAL - 70) {
    const t = easeOut((f - (TOTAL - 70)) / 22);
    g.globalAlpha = t;
    g.textAlign = 'center';
    g.fillStyle = '#a9bcff';
    g.font = '700 40px ui-monospace, monospace';
    g.fillText('npm i nocap', W / 2, H / 2 - 4);
    g.fillStyle = '#7c7c86';
    g.font = '400 17px Inter, system-ui, sans-serif';
    g.fillText('the text never enters the DOM', W / 2, H / 2 + 34);
    g.font = '400 13px Inter, system-ui, sans-serif';
    g.fillText('* a screen recording still beats it. everything else does not.',
      W / 2, H - 42);
    g.globalAlpha = 1;
  }
}

const frames = [];
for (let f = 0; f < TOTAL; f++) {
  frame(f);
  frames.push(cv.toDataURL('image/png'));
  if (f % 40 === 0) document.getElementById('status').textContent = `rendered ${f}/${TOTAL}`;
}
const sink = document.createElement('div');
sink.id = 'frames';
sink.textContent = frames.join('\n');
sink.style.display = 'none';
document.body.appendChild(sink);
document.getElementById('status').textContent = `DONE ${TOTAL} frames ${W}x${H} @${FPS}fps`;
</script>
</body>
</html>
