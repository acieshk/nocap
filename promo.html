<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nocap</title>
<meta name="description" content="Text you cannot capture. Try screenshotting this page.">
<style>
  :root { color-scheme: dark }
  * { box-sizing:border-box; margin:0 }
  body { min-height:100dvh; overflow:hidden; color:#ededed; background:#404040;
         font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;
         transition:background 700ms cubic-bezier(.4,0,.2,1) }
  /* dvh, not vh. On mobile vh is the viewport WITHOUT the address bar, so a
     100vh stage is taller than the screen and the reel sits low with the last
     beat cut off. dvh tracks the chrome as it hides and shows. */
  #stage { position:relative; width:100%; height:100dvh; min-height:100vh;
           display:grid; place-items:center; padding:0 12px }
  /* No gap, and no corner rounding. Each word is its own canvas, so any gap
     between them shows a clean stripe of page background between two noisy
     blocks, and the rounding cuts notches at every seam. The word spacing lives
     INSIDE each canvas instead, as padding around the glyphs, so the noise runs
     continuously across the whole phrase. */
  /* nowrap, so a phrase is always one line. fitFactor sizes the script to the
     narrowest dimension, so wrapping would only ever happen when that fit was
     slightly wrong, and a line breaking mid-phrase looks worse than smaller
     type. */
  .beat { position:absolute; display:flex; flex-wrap:nowrap; gap:0;
          justify-content:center; align-items:center; max-width:100%; pointer-events:none }
  /* One element per word, each on its own delay. Only opacity and an integer
     translate ever animate: scaling or rotating a canvas resamples it, and
     resampling noise moves it toward its mean, which is the attack this whole
     thing defends against. A promo animating with scale would be demonstrating
     the bypass. */
  .word { opacity:0; will-change:opacity, transform; --nocap-radius:0;
          vertical-align:middle;
          transition:opacity .42s ease, transform .52s cubic-bezier(.16,.9,.3,1) }
  /* Fast out and then nothing. No overshoot, no settle: the letters travel and
     stop dead, which is what reads as impact. */
  .beat.burst .word { transition:opacity .18s ease, transform .34s cubic-bezier(.05,.85,.1,1);
                      --nocap-enter-dur:.36s; --nocap-enter-delay:.04s }
  .beat.on .word { opacity:1; transform:translate3d(0,0,0) !important }
  .note { position:fixed; left:0; right:0; bottom:max(24px, env(safe-area-inset-bottom));
          padding:0 18px; text-align:center; font-size:13.5px; line-height:1.45; color:#e6e6e6; opacity:0;
          transition:opacity .5s ease, color .7s ease }
  /* Light beats flip the chrome, or the captions vanish into the page. */
  body.light .note { color:#2e2e2e } body.light .note b { color:#000 }
  body.light #hint { color:#575757 }
  body.light #replay { background:rgba(0,0,0,.09); color:#2b2b2b;
                       border-color:rgba(0,0,0,.22) }
  /* The install line is plain text, not a canvas. It is the one line in the reel
     that has to be readable and selectable rather than protected. */
  .term { max-width:100%; overflow:hidden; text-overflow:ellipsis; margin:0 8px;
          cursor:pointer; user-select:all; pointer-events:auto;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:600;
          color:#4ade80; background:#0c140f; border:1px solid #1e3326;
          border-radius:10px; padding:26px 42px; white-space:nowrap;
          text-shadow:0 0 22px rgba(74,222,128,.4) }
  .term .p { color:#3f7a56; margin-right:14px; user-select:none }
  .term[data-copied]::after { content:'copied'; position:absolute; margin-left:18px;
                              font-size:15px; color:#3f7a56; letter-spacing:.06em }
  .note.on { opacity:1 }
  .note b { color:#fff; font-weight:600 }
  #code { position:absolute; opacity:0; transition:opacity .6s ease; text-align:left;
          font-family:ui-monospace,SFMono-Regular,monospace; font-size:16px; line-height:1.9 }
  #code.on { opacity:1 }
  #code .k { color:#cbd6ff } #code .s { color:#ffd9a8 } #code .c { color:#adadad }
  #code .cmd { display:block; font-size:23px; color:#fff; margin-bottom:22px }
  #hint { position:fixed; top:22px; right:24px; font-size:12px; color:#cfcfcf;
          transition:color .7s ease;
          font-family:ui-monospace,monospace; letter-spacing:.04em }
  #replay { position:fixed; bottom:24px; right:24px; background:rgba(255,255,255,.14);
            color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:7px;
            padding:7px 13px; font:inherit; font-size:13px; cursor:pointer;
            opacity:0; transition:opacity .4s ease }
  #replay.on { opacity:1; pointer-events:auto }
  @media (prefers-reduced-motion: reduce) {
    /* Reduced motion: no wipe, the texture is simply there. */
    .word { transition:opacity .3s ease } body { transition:none }
  }
  /* Candidate page textures. All are translucent overlays rather than colours,
     so they sit over whatever hue the current beat set without being retinted.
     Behind the words: this is about the ground the element sits on, not about
     putting anything over the canvas. */
  #pattern { position:fixed; inset:0; pointer-events:none; z-index:0;
             transition:opacity .5s ease }
  #stage { position:relative; z-index:1 }
  /* Three textures, all of which the element can reproduce in its own layer:
     hatch, dots, grid. Grain and the vignette were dropped -- grain is too fine
     to survive as a foreground over noise, and the vignette is not a texture at
     all, so neither could be continued INTO the element, which is the whole
     point of pairing a pattern with it. */
  /* Diagonal hatch, far coarser than any noise block, so nothing beats. */
  body.p-hatch #pattern { opacity:1;
    background-image:repeating-linear-gradient(45deg,
      rgba(255,255,255,var(--pat-a,.10)) 0 3px, transparent 3px 13px);
    background-size:18.3848px 18.3848px }
  /* Dot grid. Regular, which is the opposite of the noise, so the element reads
     as the irregular thing on a tidy ground. */
  body.p-dots #pattern { opacity:1;
    background-image:radial-gradient(rgba(255,255,255,var(--pat-a,.20)) 1.7px, transparent 1.8px);
    background-size:16px 16px }
  /* Square grid. The most architectural of the three, and the one that makes an
     unaligned element most obvious, which is why it is worth having. */
  body.p-grid #pattern { opacity:1;
    background-image:
      repeating-linear-gradient(rgba(255,255,255,var(--pat-a,.11)) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(255,255,255,var(--pat-a,.11)) 0 1px, transparent 1px 46px);
    background-size:46px 46px }
  /* On a light beat a white pattern disappears into the ground, so it inverts.
     Same texture, opposite ink. */
  body.light.p-hatch #pattern { background-image:repeating-linear-gradient(45deg,
      rgba(0,0,0,var(--pat-a,.10)) 0 3px, transparent 3px 13px);
    background-size:18.3848px 18.3848px }
  body.light.p-dots #pattern { background-image:radial-gradient(rgba(0,0,0,var(--pat-a,.20)) 1.7px,
      transparent 1.8px); background-size:16px 16px }
  body.light.p-grid #pattern { background-image:
      repeating-linear-gradient(rgba(0,0,0,var(--pat-a,.11)) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(0,0,0,var(--pat-a,.11)) 0 1px, transparent 1px 46px);
    background-size:46px 46px }


  /* The capture panel. Sits over the reel, holds the image that came back. */
  /* The ending is a summary, not a modal. The install line stays put and the
     captures stack underneath it, so the last thing on screen is the command
     plus the evidence for it. An overlay covered the command, which is the one
     line worth acting on. */
  #shots { position:fixed; left:0; right:0; bottom:5vh; z-index:4;
           display:flex; flex-direction:column; align-items:center; gap:7px;
           opacity:0; pointer-events:none; transition:opacity .7s ease .3s;
           padding:0 16px }
  body.ending #shots { opacity:1 }
  /* Bounded on BOTH axes: four strips have to clear the command above them, and
     width alone would let a wide one push the stack off the bottom. */
  #shots canvas { max-width:min(88vw, 520px); max-height:min(11vh, 82px);
                  width:auto; height:auto; border-radius:6px;
                  border:1px solid rgba(255,255,255,.22); display:block }
  body.light #shots canvas { border-color:rgba(0,0,0,.22) }
  #shotcap { font-size:12px; color:#a9a9a9; text-align:center; line-height:1.4;
             max-width:min(88vw, 520px); margin-top:2px }
  #shotcap b { color:#e9e9e9 }
  body.light #shotcap { color:#5a5a5a } body.light #shotcap b { color:#1c1c1c }
  /* Lift the command so the captures have room beneath it. Translate only, and
     the install line is plain text rather than a canvas, so nothing resamples. */
  body.ending .beat.on { transform:translateY(-27vh); transition:transform .7s cubic-bezier(.16,.9,.3,1) }
  /* A nudge toward the replay button. The reel just asserted something about
     capture; the only honest close is to invite the viewer to test it, and the
     button they need is easy to miss in a corner. Bottom-right so its tail
     points at the thing it is talking about. */
  #nudge { position:fixed; right:24px; bottom:72px; z-index:6;
           max-width:min(74vw, 236px); background:#fff; color:#141414;
           border-radius:11px; padding:11px 14px; font-size:13px; line-height:1.45;
           opacity:0; pointer-events:none; box-shadow:0 8px 26px rgba(0,0,0,.4);
           transition:opacity .55s ease 1.2s }
  #nudge b { display:block; margin-bottom:2px }
  #nudge::after { content:''; position:absolute; right:28px; bottom:-6px;
                  width:13px; height:13px; background:#fff; transform:rotate(45deg);
                  border-radius:2px }
  body.light #nudge { background:#141414; color:#f4f4f4 }
  body.light #nudge::after { background:#141414 }
  body.ending #nudge { opacity:1; animation:nudgebob 2.8s ease-in-out 1.9s infinite }
  @keyframes nudgebob { 0%,100% { translate:0 0 } 50% { translate:0 -5px } }
  @media (prefers-reduced-motion: reduce) {
    body.ending #nudge { animation:none }
  }
  /* On a narrow screen the stack and the bubble both want the bottom, so the
     stack gives way rather than being overlapped. */
  @media (max-width: 640px) {
    /* The stack and the bubble both want the bottom of a phone. The stack gives
       way and shrinks, and the bubble collapses to one line, or the lowest
       capture ends up underneath it. */
    #shots { bottom:20vh; gap:6px }
    #shots canvas { max-height:min(8vh, 58px) }
    #nudge { bottom:72px; max-width:min(76vw, 230px); padding:9px 12px }
    #nudge b { display:inline; margin:0 }
  }
</style>
</head>
<body>
<div id="pattern"></div>
<div id="stage"></div>
<div class="note" id="note"></div>
<div id="hint">screenshot me</div>
<button id="replay">replay</button>
<div id="shots"></div>
<div id="nudge"><b>Not convinced?</b>Replay it and take your own screenshot.</div>

<script type="module">
import './src/secret.js';

/**
 * The live reel. A recording cannot show this, which is the whole reason the
 * page exists: the effect only happens at a display's refresh rate, where an eye
 * integrates two planes and a capture lands on one. Filmed, it is either flat
 * text or noise. So it runs live and asks the viewer to attack it.
 */
const stage = document.getElementById('stage');
const note = document.getElementById('note');
const replay = document.getElementById('replay');

/**
 * Tinted palettes at the luminance of the pair that is known to mask.
 *
 * #6d6d6d on #404040 measures 1.00 and is about the darkest that does. These
 * hold its two lightnesses and add hue. Saturation stays low on purpose: a
 * saturated colour pins a channel near an extreme, that channel cannot be
 * displaced, and the pair stops masking however far apart the colours look.
 */
// 0.05, found by measurement rather than taste. At 0.14 the tinted pairs fell
// to 0.81 masking against the neutral's 1.00, because saturation eats swing:
// the further a channel sits from mid, the less room it has to be displaced.
// This is the most hue the palette can carry and still mask.
const SAT = 0.05;
function hsl(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  };
  const hx = (v) => v.toString(16).padStart(2, '0');
  return '#' + hx(f(0)) + hx(f(8)) + hx(f(4));
}
/**
 * Light ground, dark text, dimmed. #6a6a6a on #b0b0b0 measures 1.04, the same
 * as the brighter #737373 on #bfbfbf it replaces and better than the dark
 * default's 1.00, because both colours still sit where there is swing to spend.
 *
 * Dimming is not free in general and had to be swept rather than nudged: the
 * separation has to come down with the background or the ratio goes with it.
 * #bababa/#747474 gives 1.14, #a6a6a6/#636363 gives 1.02, and it stays near 1.0
 * down to about #929292. Past #c7c7c7 in the other direction it collapses, since
 * a channel near 255 has nowhere left to go.
 */
const LIGHT = { fg: '#6a6a6a', bg: '#b0b0b0' };

/**
 * How far the texture moves its ground, in levels, on BOTH sides of the
 * element's edge.
 *
 * The page used a fixed .10 alpha, which is not a fixed amount of texture: over
 * #b0b0b0 it moves 17.6 levels and over a dark beat it moves 23, so "the page's
 * texture" was a different weight on every screen and the element could only
 * ever coincide with it by luck. Solving the alpha per ground -- compositing c
 * over V gives V + a*(c - V), so a = levels/span -- makes one number mean one
 * thing everywhere, which is the only way the two can be set to match.
 */
const PATTERN_LEVELS = 20;

/** The alpha that moves `bg` by PATTERN_LEVELS, matching what the element does. */
function patternAlpha(bgHex, light) {
  const v = parseInt(bgHex.slice(1), 16);
  const V = 0.2126 * ((v >> 16) & 255) + 0.7152 * ((v >> 8) & 255) + 0.0722 * (v & 255);
  const span = light ? V : 255 - V;      // light beats ink dark, dark beats ink light
  return span > 0 ? Math.min(0.9, PATTERN_LEVELS / span) : 0;
}

const pal = (b) => (b.plain ? { fg: '#4ade80', bg: '#0c140f' }
  : b.light ? LIGHT
  : b.hue === null ? { fg: '#6d6d6d', bg: '#404040' }
  : { fg: hsl(b.hue, b.sat ?? SAT, 0.427), bg: hsl(b.hue, b.sat ?? SAT, 0.251) });

/**
 * Weights lean light, because a thinner stem simply looks better here. It also
 * happens to help: the block the element derives is twice the STROKE, and a
 * 300-weight stem is far narrower than the size/8 that derivation assumes, so
 * lighter type wants a finer block on both aesthetic and measured grounds.
 */
const SCRIPT = [
  // Impact opener. Split per character and released together so the letters
  // converge and stop dead. Block 16 is a compromise: a stem this thick would
  // take a coarser block by the derivation, and coarser reads as tiles at this
  // size, which is the opposite of impact.
  // Ordinary type, and the only beat in the reel that is. A greeting has nothing
  // to protect, so protecting it would be theatre -- and it buys something: as
  // plain text it is free of the masking palette, so it can run at full contrast
  // where every protected beat is pinned near 1.9:1.
  //
  // It also sets the terms. The reel opens legible, and the first thing that
  // turns to noise is the product name one beat later, which is the moment the
  // effect introduces itself rather than being on screen before it is explained.
  //
  // Still split per character and burst, so the letters converge and stop dead.
  { pattern: 'dots', text: 'Hi!', plainText: true, ink: '#f2f2f2',
    size: 190, hold: 1500, hue: null, enter: 'burst', split: 'chars',
    face: 'Inter, system-ui, sans-serif', weight: 800, block: 16 },

  // From here the reel is mixed lines, and the plain half always comes FIRST.
  //
  // Leading with real type gives the eye somewhere to land before it hits the
  // block, so the block reads as "this part is protected" rather than as a
  // broken image. Lead with noise and the line has no anchor -- the reader is
  // decoding before they know what they are looking at.
  //
  // Mixing is also the only way the effect is legible AS an effect. A wall of
  // noise looks like a rendering fault. The same noise beside real text at the
  // same size is obviously deliberate, and the cost in legibility is right
  // there to judge instead of being asserted.
  { pattern: 'dots', mix: [{ t: 'This is' }, { n: 'nocap' }],
    text: 'This is nocap', size: 84, hold: 1700, hue: 210, enter: 'up',
    face: 'Inter, system-ui, sans-serif', weight: 600, block: 11 },

  // The demonstration IS the sentence. A capture keeps the plain words and
  // replaces the protected one with a block, so the camera's copy reads
  // "You can read ___" -- the line disproving itself, in the camera's own words.
  { pattern: 'dots', mix: [{ t: 'You can read' }, { n: 'this.' }],
    text: 'You can read this.', size: 76, hold: 2000, hue: 210, light: true, enter: 'up',
    face: 'Georgia, "Times New Roman", serif', weight: 400, block: 8, shot: true,
    note: 'ordinary reading. <b>no plugin, no glasses, no effort</b>' },

  // The turn, and the one beat that is deliberately all noise: it is the claim
  // about what machines get, so it is delivered in what machines get.
  { pattern: 'dots', text: 'Nothing else can.', size: 94, hold: 2100, hue: 210, enter: 'up',
    face: 'Inter, system-ui, sans-serif', weight: 700, block: 12,
    note: 'not your camera. not the DOM. <b>not a scraper</b>' },

  // Wordplay: the block literally is the nothing. In a capture the line reads
  // "Your camera reads: ___", which is both the claim and its evidence.
  { pattern: 'hatch', mix: [{ t: 'Your camera reads:' }, { n: 'nothing' }],
    text: 'Your camera reads: nothing', size: 64, hold: 2200, hue: 190, chroma: 0.4, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 8,
    note: 'go on. <b>Print Screen</b>, or point your phone at it' },

  { pattern: 'grid', mix: [{ t: 'Open DevTools.' }, { n: 'Nothing there.' }],
    text: 'Open DevTools. Nothing there.', size: 62, hold: 2300, hue: 275, light: true, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 8,
    note: 'no text node, no aria-label, no innerText. a <code>&lt;canvas&gt;</code> and nothing else' },

  { pattern: 'grid', mix: [{ t: 'A scraper finds' }, { n: 'no text.' }],
    text: 'A scraper finds no text.', size: 66, hold: 1900, hue: 35, chroma: 0.4, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 8,
    note: 'not obfuscated. <b>absent.</b> there is nothing to lift' },

  // What it is for, in the shape it is actually used: a label you can read and
  // a value you cannot.
  { pattern: 'grid', mix: [{ t: 'Account number' }, { n: '4111 1111 1111 1111' }],
    text: 'Account number 4111 1111 1111 1111', size: 54, hold: 2000, hue: 150, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 7, shot: true },
  { pattern: 'grid', mix: [{ t: 'API key' }, { n: 'sk-live-9f2a4c81b73e' }],
    text: 'API key sk-live-9f2a4c81b73e', size: 54, hold: 2000, hue: 150, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 7, shot: true,
    note: 'the label is ordinary text. <b>only the value is protected</b>' },

  // The proof, taken on the viewer's own machine. The line is written so the
  // capture completes it: what comes back reads "This half survives. ___".
  { pattern: 'hatch', mix: [{ t: 'This half survives.' }, { n: 'This half does not.' }],
    text: 'This half survives. This half does not.', size: 54, hold: 2800, hue: 200, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 7, shot: true,
    note: 'and a capture of this line is waiting at the end' },

  { pattern: 'dots', mix: [{ t: 'One catch:' }, { n: 'a recording still wins.' }],
    text: 'One catch: a recording still wins.', size: 60, hold: 2400, hue: 345, enter: 'left',
    face: 'Inter, system-ui, sans-serif', weight: 400, block: 8,
    note: 'stills and scrapers lose. <b>video does not.</b> inherent, and we do not hide it' },

  { pattern: 'hatch', text: 'Try it?', size: 84, hold: 1300, hue: 210, enter: 'up',
    face: 'Inter, system-ui, sans-serif', weight: 300, block: 10 },
  // Terminal green, and 0.11 is as green as it gets. Saturation eats swing, so
  // by 0.30 the pair is down to 0.46 masking and a bright phosphor green does
  // not exist at any usable ratio. This is the most green the technique allows.
  // NOT rendered through the library, and that is the right call rather than a
  // shortcut. It is an install command: it has to be read and typed, so it wants
  // maximum legibility, and it is not a secret so there is nothing to protect.
  //
  // It also buys the look. A true dark ground has no swing to spend, so terminal
  // green on near-black cannot mask: measured, #326744 on #1b281f comes out at
  // 0.39 and the best dark pair I found reached 0.68. Rendering it as plain text
  // means no compromise on either side, instead of a bad ratio AND a muted green.
  { pattern: 'hatch', text: 'npm i nocap', hold: 2600, hue: 140, sat: 0.11, plain: true },
];

// Where each word starts before it settles at the centre. Per word rather than
// per line, so a phrase assembles instead of sliding in as a slab.
const ENTER = {
  up:   (i) => `translate3d(0, ${30 + i * 6}px, 0)`,
  left: (i) => `translate3d(${-70 - i * 26}px, 0, 0)`,
  alt:  (i) => `translate3d(0, ${i % 2 ? 34 : -34}px, 0)`,
  // Not a CSS scale, which would resample the canvas. The words fan out from
  // the centre and close up, which reads as a zoom without touching a pixel of
  // the rendered noise.
  fan:  (i, n) => `translate3d(${(i - (n - 1) / 2) * 54}px, 0, 0)`,
  // Stacked at the centre, so releasing them reads as the word expanding out.
  burst: (i, n) => `translate3d(${((n - 1) / 2 - i) * 74}px, 0, 0)`,
};

/**
 * Which way the texture wipes in, per entrance.
 *
 * The words already travel from somewhere; the texture arriving from the same
 * side makes the two read as one movement instead of a panel that shows up
 * already dressed. 'fan' and 'burst' open outward from the middle, so those get
 * a radial reveal rather than a directional one.
 */
const ENTER_WIPE = { up: 'up', left: 'left', alt: 'up', fan: 'center', burst: 'center' };

/**
 * How much to shrink the whole script so the widest beat fits the screen.
 *
 * The type CANNOT be scaled with CSS after the fact: transforming a canvas
 * resamples it, and resampling noise moves it toward its mean, which is the
 * attack this page exists to refuse. So the fit has to happen before anything is
 * rendered, by choosing a smaller font and splitting at that size instead.
 *
 * One factor for the whole reel rather than per beat, so the relative weight of
 * the lines survives. Shrinking only the widest would flatten the rhythm.
 */
/**
 * The width the fit is computed against.
 *
 * `?w=390` overrides it, which exists because headless Chrome reports its own
 * viewport whatever --window-size is passed, so phone widths could not be tested
 * at all. Without a way to drive this, the mobile fit was only ever reasoned
 * about. A query parameter is a small price for being able to check it.
 */
const VIEW = new URL(location.href).searchParams;
const VW = +VIEW.get('w') || innerWidth;
const VH = +VIEW.get('h') || innerHeight;

// One place, so the measuring pass and the render agree. They disagreeing is
// exactly how the line came to overflow.
const PAD = (b) => (b.split === 'chars' ? 22 : 66);
const pad = (b) => Math.max(6, Math.round(PAD(b) * FIT));

function fitFactor() {
  const probe = document.createElement('canvas').getContext('2d');
  let widest = 1;
  let tallest = 1;
  for (const b of SCRIPT) {
    if (b.plain) continue;
    // Measured at the DESIGN size. Using FIT here would read it before it is
    // assigned, since FIT is what this function returns, and the whole page
    // died on that temporal dead zone with no element rendered at all.
    probe.font = `${b.weight} ${b.size}px ${b.face}`;
    const p = PAD(b);
    const units = b.split === 'chars' ? [...b.text] : b.text.split(' ');
    widest = Math.max(widest,
      units.reduce((sum, u) => sum + probe.measureText(u).width + p, 0));
    tallest = Math.max(tallest, b.size * 1.95);
  }
  const availW = Math.max(240, VW - 24);
  // Leave room for the caption under the words.
  const availH = Math.max(220, VH - 150);
  let fit = Math.min(1, availW / widest, availH / tallest);

  // Second pass, measuring at the size the type will ACTUALLY render.
  //
  // The first pass measures at the design size and scales, which is wrong by a
  // few pixels per word: each element rounds its width up, and text width is not
  // perfectly linear in font size. Those roundings accumulate across a phrase,
  // so a four-word line came out 407px in a 430px viewport and 372 in a 390 one.
  // Small, and an overflow either way.
  for (let pass = 0; pass < 3 && fit > 0.05; pass++) {
    let real = 0;
    for (const b of SCRIPT) {
      if (b.plain) continue;
      const size = Math.max(13, Math.round(b.size * fit));
      probe.font = `${b.weight} ${size}px ${b.face}`;
      const units = b.split === 'chars' ? [...b.text] : b.text.split(' ');
      const q = Math.max(6, Math.round(PAD(b) * fit));
      real = Math.max(real,
        units.reduce((sum, u) => sum + Math.ceil(probe.measureText(u).width) + q, 0));
    }
    if (real <= availW) break;
    fit *= availW / real;
  }
  return fit;
}

let FIT = fitFactor();

/**
 * One element per word. The element draws a single line, so a phrase is several
 * of them, and that is what lets each word carry its own entrance.
 */
const beats = SCRIPT.map((b) => {
  const wrap = document.createElement('div');
  wrap.className = 'beat';
  const { fg, bg } = pal(b);
  if (b.plain) {
    const term = document.createElement('div');
    term.className = 'word term';
    term.style.fontSize = `${Math.max(19, Math.round(46 * FIT))}px`;
    term.innerHTML = '<span class="p">$</span>' + b.text;
    term.title = 'click to copy';
    // Selectable AND one click away. It is the only line here meant to leave the
    // screen, so retyping it should never be the only option.
    term.onclick = async () => {
      try {
        await navigator.clipboard.writeText(b.text);
        term.dataset.copied = '1';
        setTimeout(() => { delete term.dataset.copied; }, 1400);
      } catch {
        // Clipboard needs a permission and a secure context. user-select:all
        // means one click already selects the whole line, so say that instead of
        // reporting a failure at someone who can just press Ctrl+C.
        getSelection().selectAllChildren(term);
      }
    };
    term.style.transform = 'translate3d(0, 26px, 0)';
    wrap.appendChild(term);
    stage.appendChild(wrap);
    return { ...b, wrap };
  }

  if (b.enter === 'burst') wrap.classList.add('burst');
  // A beat is a list of parts. Normally every part is protected; a `mix` beat
  // names which are plain text and which are not.
  const words = b.mix
    ? b.mix
    : (b.split === 'chars' ? [...b.text] : b.text.split(' '))
        .map((w) => (b.plainText ? { t: w } : { n: w }));

  // Shared by both kinds of part, because it drifted once already: the plain
  // branch staggered a burst that the element branch released together, so 'Hi!'
  // arrived letter by letter over 140ms instead of snapping shut. A burst reads
  // as impact only when the pieces stop at the same instant; stagger it and it
  // becomes a wipe, which looks like lag rather than intent.
  const delayFor = (k) => (b.enter === 'burst' ? '0ms' : `${k * 70}ms`);

  words.forEach((part, i) => {
    const word = typeof part === 'string' ? part : part.n;
    if (part && part.t !== undefined) {
      // Ordinary text, and deliberately so: it is in the DOM, it is selectable,
      // and a scraper gets it. That is the point of showing it beside the part
      // that is not.
      const span = document.createElement('span');
      span.textContent = part.t;
      span.className = 'word plain';
      const size = Math.max(13, Math.round(b.size * FIT));
      // The padding is WORD spacing, so a per-character split must not get it
      // or the letters fly apart into separate words.
      const gap = b.split === 'chars' ? 0 : Math.round(size * 0.42);
      // Plain text is not carrying noise, so nothing constrains its contrast.
      //
      // It was inheriting the element's colour, which sits near 1.9:1 because
      // that is what masking leaves once the palette is fitted. On protected
      // type that is the price of the effect; on ordinary type it is just dim,
      // and it made the surviving half recede into the ground -- the exact
      // opposite of the point, since the whole line exists to contrast what
      // stays with what does not.
      //
      // Full contrast against the beat's own ground instead.
      span.style.cssText =
        `font-family:${b.face}; font-weight:${b.weight}; font-size:${size}px;` +
        `color:${b.ink ?? (b.light ? '#1c1c1c' : '#f1f1f1')};` +
        `line-height:1; vertical-align:middle;` +
        `padding-right:${gap}px; white-space:pre`;
      span.style.transform = (ENTER[b.enter] ?? ENTER.up)(i, words.length);
      span.style.transitionDelay = delayFor(i);
      wrap.appendChild(span);
      return;
    }
    const el = document.createElement('nocap-secret');
    const probe = document.createElement('canvas').getContext('2d');
    const size = Math.max(13, Math.round(b.size * FIT));
    probe.font = `${b.weight} ${size}px ${b.face}`;
    // The spacing between words is padding inside this canvas rather than a gap
    // outside it, so adjacent words touch and the noise is unbroken.
    el.setAttribute('width',
      // Padding scales with the fit too, and it has to. It was fixed, so on a
      // narrow screen the type shrank while the gaps did not: at 320px the
      // padding alone came to more than the viewport and a four-word line had
      // nowhere to go but a second row.
      //
      // It is generous because it does two jobs. The spacing between words lives
      // INSIDE each canvas rather than as a gap between them, since a gap shows
      // a clean stripe of page background between two noisy blocks. So this is
      // the word gap as well as the margin.
      String(Math.ceil(probe.measureText(word).width) + pad(b)));
    el.setAttribute('height', String(Math.round(size * 1.95)));
    el.setAttribute('font-family', b.face);
    el.setAttribute('font-weight', String(b.weight));
    // A scale, not a size: font-size is device pixels against the canvas
    // height, so type would come out half-sized on a 2x display.
    el.setAttribute('font-scale', '0.56');
    el.setAttribute('color', fg);
    el.setAttribute('background', bg);
    // Set per beat, under the 2x-stroke the element derives. That rule gives
    // 24 to 30px at this size, which reads as tiles rather than noise, and at
    // stroke 13 a 12px block measured finer AND better on both axes. It was
    // calibrated at strokes 3 to 8 and has a ceiling above them.
    // The block shrinks with the type, or a phone gets the desktop block over
    // much smaller glyphs and it reads as tiles again.
    el.setAttribute('noise-scale', String(Math.max(3, Math.round(b.block * FIT))));
    // Coloured noise on a few beats, for variety rather than for protection.
    // Grey noise puts the whole budget into luminance, which is what the eye and
    // OCR both key on, so splitting it across channels costs something real.
    // Measured on this palette at block 12, 8 seeds: leak 0.227 at chroma 0,
    // 0.267 at 0.4, 0.279 at 1. Cheaper than the repo's older 0.298-to-0.389
    // figure because that was taken at a finer block, where the block is not
    // dominating. 0.4 is a fifth more leak for a visible tint, on beats that are
    // not the ones inviting a screenshot.
    if (b.chroma) el.setAttribute('chroma', String(b.chroma));
    // NO edge-fade here, and the reason is worth keeping. It tapers the noise at
    // each element's own boundary, which is right for a lone element sitting on
    // a page. In a row of words every seam gets TWO taperings meeting, and the
    // quiet valley between them reads as a border drawn around each word. It
    // produced the exact rectangles it was added to remove.
    //
    // Adjacent elements want a flat amplitude and no rounding, which is what
    // gap:0 plus --nocap-radius:0 already gives.
    // The texture goes on BEFORE the secret, because that is what triggers the
    // first render. attributeChangedCallback only repaints a revealed element,
    // so a pattern set afterwards was accepted, stored, and never drawn -- the
    // element carried pattern-layer="front" and painted nothing.
    el.setAttribute('pattern', b.pattern);
    el.setAttribute('pattern-layer', 'front');
    // 50 against the page's 20. A level count is not a visibility: over the flat
    // page 20 levels is the whole local contrast, while over noise spanning 0 to
    // 255 the eye normalises it away. Shot at 20/45/70/100, 20 is invisible and
    // 50 matches. Unequal numbers are what look equal.
    el.setAttribute('pattern-strength', '50');
    el.setAttribute('pattern-enter', ENTER_WIPE[b.enter] ?? 'up');
    // Paused until its beat is on screen. Thirty-nine canvases animating at
    // once pulled the page to ~41Hz, which puts the two-plane cycle at 21Hz --
    // squarely in the band the flicker warning exists to complain about.
    el.setAttribute('paused', '');
    el.className = 'word';
    el.style.transform = (ENTER[b.enter] ?? ENTER.up)(i, words.length);
    el.style.transitionDelay = delayFor(i);
    wrap.appendChild(el);
    el.secret = word;
  });

  stage.appendChild(wrap);
  return { ...b, wrap };
});

let timer = 0;
let stopped = false;


/**
 * Build what a screenshot of this beat contains -- automatically, no permission.
 *
 * getDisplayMedia can never run on its own: browsers require a gesture, by
 * design, and it does not exist on iOS Safari or Android Chrome at all. So a
 * button was the only way to use it, and on a phone the button could not work.
 *
 * We do not need the OS. A capture of this line contains exactly two things:
 * the plain text, which is an ordinary text node, and ONE PLANE of the element.
 * planes[0] is that plane -- the same pixel data any screenshot lands on, not a
 * rendering of what one might look like. Compositing the two in their measured
 * positions reproduces the capture rather than imitating it.
 *
 * The honest caveat, and the caption says it: we assembled this, the operating
 * system did not. Every pixel in it is real; the arrangement is ours.
 */

/**
 * Draw one of the three textures into a canvas, phase-locked to the page.
 *
 * A composed capture was missing both of them: planes[0] is the CANVAS only,
 * and the element's texture is a CSS layer composited over it, while the page's
 * ground pattern is a separate fixed layer underneath. A real screenshot has
 * all three. Reproducing only the middle one made the shot cleaner than the
 * truth, which is the wrong direction for a proof.
 *
 * phx/phy carry where this canvas sits in the viewport, so the lattice
 * continues from the page's origin instead of restarting at the crop.
 */
function paintTexture(ctx, kind, levels, bgHex, x, y, w, hgt, phx, phy) {
  if (!kind || !levels) return;
  const v = parseInt(bgHex.slice(1), 16);
  const V = 0.2126 * ((v >> 16) & 255) + 0.7152 * ((v >> 8) & 255) + 0.0722 * (v & 255);
  const dir = V < 128 ? 1 : -1;
  const span = dir > 0 ? 255 - V : V;
  if (span <= 0) return;
  const a = Math.min(0.9, levels / span);
  const ink = dir > 0 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, hgt);
  ctx.clip();
  ctx.translate(-phx, -phy);
  const x0 = phx, y0 = phy, x1 = phx + w + x, y1 = phy + hgt + y;
  if (kind === 'dots') {
    ctx.fillStyle = ink;
    const u = 16;
    for (let py = Math.floor(y0 / u) * u; py < y1 + u; py += u) {
      for (let px = Math.floor(x0 / u) * u; px < x1 + u; px += u) {
        ctx.beginPath();
        ctx.arc(px + u / 2, py + u / 2, 1.7, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (kind === 'hatch') {
    // 13px PERPENDICULAR, which is 13*sqrt(2) along x for a 45deg line.
    ctx.strokeStyle = ink;
    ctx.lineWidth = 3;
    const step = 13 * Math.SQRT2;
    for (let d = Math.floor((x0 - y1) / step) * step; d < x1 + step; d += step) {
      ctx.beginPath();
      ctx.moveTo(d + y0, y0);
      ctx.lineTo(d + y1, y1);
      ctx.stroke();
    }
  } else if (kind === 'grid') {
    ctx.fillStyle = ink;
    const g = 46;
    const lw = Math.max(1, Math.round(levels / 25));
    for (let py = Math.floor(y0 / g) * g; py < y1 + g; py += g) ctx.fillRect(x0 - g, py, (x1 - x0) + g * 2, lw);
    for (let px = Math.floor(x0 / g) * g; px < x1 + g; px += g) ctx.fillRect(px, y0 - g, lw, (y1 - y0) + g * 2);
  }
  ctx.restore();
}

function shotOf(b) {
  const kids = [...b.wrap.children];
  if (!kids.length) return null;
  const box = b.wrap.getBoundingClientRect();
  const pad = 26;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = document.createElement('canvas');
  cv.width = Math.ceil((box.width + pad * 2) * dpr);
  cv.height = Math.ceil((box.height + pad * 2) * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const bg = pal(b).bg;
  const W = box.width + pad * 2;
  const H = box.height + pad * 2;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Layer 1: the page's own ground, phase-locked to the viewport origin so the
  // lattice runs through the crop exactly as it does on screen.
  const phx = box.left - pad;
  const phy = box.top - pad;
  paintTexture(ctx, b.pattern, PATTERN_LEVELS, bg, 0, 0, W, H, phx, phy);

  for (const k of kids) {
    const r = k.getBoundingClientRect();
    const x = r.left - box.left + pad;
    const y = r.top - box.top + pad;
    if (k.tagName === 'SPAN') {
      const cs = getComputedStyle(k);
      ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      ctx.fillStyle = cs.color;
      ctx.textBaseline = 'middle';
      ctx.fillText(k.textContent, x, y + r.height / 2);
    } else {
      // The actual plane. Not a picture of one.
      const p = k.planes?.[0];
      if (!p) continue;
      const tmp = document.createElement('canvas');
      tmp.width = p.width;
      tmp.height = p.height;
      tmp.getContext('2d').putImageData(new ImageData(p.data, p.width, p.height), 0, 0);
      ctx.drawImage(tmp, x, y, r.width, r.height);
      // Layer 3: the element's foreground texture, over its own canvas and at
      // its own strength -- 50 against the page's 20, because the same level
      // count reads as nothing over noise and obvious over a flat ground.
      paintTexture(ctx, b.pattern, 50, bg, x, y, r.width, r.height, phx, phy);
    }
  }
  return cv;
}

/** Captures taken during the reel, shown together on the install screen. */
const shots = [];

function play(i) {
  if (stopped) return;
  // The install line is the last thing on screen and it stays there. A separate
  // code slide after it moved the eye off the one line worth acting on, and the
  // README is a better home for a snippet than the end of a reel.
  if (i >= beats.length) {
    if (shots.length) {
      const box = document.getElementById('shots');
      const cap = document.createElement('div');
      cap.id = 'shotcap';
      // One line. The stack of captures is the argument; a paragraph under it
      // just competes with the command for the last thing read.
      cap.innerHTML = 'what a screenshot gets &mdash; '
        + '<b>the label survives, the value never does</b>';
      box.replaceChildren(...shots, cap);
      document.body.classList.add('ending');
    }
    note.innerHTML = 'MIT &middot; <b>github.com/acieshk/nocap</b>';
    note.classList.add('on');
    replay.classList.add('on');
    return;
  }

  const b = beats[i];
  document.body.style.background = pal(b).bg;
  document.body.style.setProperty('--pat-a',
    String(patternAlpha(pal(b).bg, Boolean(b.light))));
  // The page's ground follows the beat, so the texture cuts with the type.
  document.body.classList.remove('p-hatch', 'p-dots', 'p-grid');
  document.body.classList.add('p-' + b.pattern);
  // Phase now, not at build: the words are laid out by then, so their resting
  // positions are real. Cheap, and it re-runs on resize through the same path.
  for (const el of b.wrap.children) {
    el.removeAttribute('paused');
    alignPattern(el);
    // Removing and re-adding restarts the animation, so a replayed reel wipes
    // again instead of showing an already-finished texture.
    el.removeAttribute('pattern-playing');
    void el.offsetWidth;
    el.setAttribute('pattern-playing', '');
  }
  document.body.classList.toggle('light', Boolean(b.light));
  b.wrap.classList.add('on');
  note.innerHTML = b.note ?? '';
  note.classList.toggle('on', Boolean(b.note));

  if (b.shot) {
    // Taken once the words have arrived and stopped, so the geometry measured
    // here is the geometry a viewer would have captured. Collected rather than
    // shown now: they land together at the end, where two of them side by side
    // make the point that one cannot -- the label survives every time and the
    // value never does.
    setTimeout(() => { const c = shotOf(b); if (c) shots.push(c); }, 900);
  }

  if (i === beats.length - 1) {
    timer = setTimeout(() => play(i + 1), b.hold);
    return;
  }

  timer = setTimeout(() => {
    exitBeat(b);
    play(i + 1);
  }, b.hold);
}

/**
 * Fade a beat out and put it back the way it started.
 *
 * Every path that leaves a beat has to come through here. The capture beat did
 * not -- it returned early with its own timer and never dropped the `on` class,
 * so it stayed lit behind every beat that followed and its noise blocks sat
 * under the rest of the reel. It looked like a stacking bug and it was a missing
 * teardown.
 */
function exitBeat(b) {
    b.wrap.classList.remove('on');
    // Put the start offsets back once it has faded, so the next loop enters the
    // same way rather than appearing from wherever it stopped.
    setTimeout(() => {
      // Faded out now, so it can stop animating. Doing this in play() paused it
      // while it was still visible, and a frozen plane is raw noise -- the
      // coloured block that was left behind on every exit.
      for (const el of b.wrap.children) el.setAttribute('paused', '');
      if (b.plain) {
        const el = b.wrap.firstChild;
        el.style.transition = 'none';
        el.style.transform = 'translate3d(0, 26px, 0)';
        requestAnimationFrame(() => { el.style.transition = ''; });
        return;
      }
      const words = [...b.wrap.children];
      words.forEach((el, k) => {
        el.style.transition = 'none';
        el.style.transform = (ENTER[b.enter] ?? ENTER.up)(k, words.length);
        requestAnimationFrame(() => { el.style.transition = ''; });
      });
    }, 440);
}


function start() {
  stopped = false;
  document.body.classList.remove('ending');
  document.getElementById('shots').replaceChildren();
  shots.length = 0;
  clearTimeout(timer);
  replay.classList.remove('on');
  for (const b of beats) b.wrap.classList.remove('on');
  setTimeout(() => play(0), 320);
}

// Rebuild on a real size change, since the type was baked at the old fit and
// cannot be rescaled afterwards without resampling the canvas. Ignores the
// small height changes a mobile address bar causes as it hides.
let lastW = innerWidth;
addEventListener('resize', () => {
  if (VIEW.get('w')) return;
  if (Math.abs(innerWidth - lastW) < 60) return;
  lastW = innerWidth;
  location.reload();
});

replay.onclick = start;
// A backgrounded tab should not keep cycling.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopped = true; clearTimeout(timer); }
  else start();
});
/**
 * Page texture, switchable, so the choice can be made by looking rather than
 * argued about.
 *
 * The pattern is on the PAGE and never inside the element. Measured: a pattern
 * in the element's own background costs nothing at 6 levels, 0.197 to 0.200
 * raw, but 0.285 raw and 0.380 blurred at 34, because the split has to carry it
 * as content and its dark parts leave those pixels less headroom. Outside the
 * canvas there is no such constraint, so this is free.
 */
// Which page texture maps onto which in-element pattern, so the texture runs
// across the element boundary instead of stopping at it. Faint inside, because
// in there the split has to carry it: 6 levels is measured free.
/**
 * The texture is a property of the BEAT, not a control.
 *
 * A picker asked the viewer to choose the ground for a reel that is thirty
 * seconds long -- nobody chooses, everybody watches the default, and the
 * default was the only version that ever got seen. Assigning per beat also
 * lets the texture change WITH the cut instead of sitting under all of it, so
 * it enters alongside the type rather than persisting through it.
 *
 * The arc: dots to open (regular, calm, establishes a ground), hatch through
 * the refusals (diagonal and adversarial, escalating with the copy), grid for
 * the DevTools proof (architectural, and the most technical-reading of the
 * three), dots again for the honest caveat, hatch to close on the invitation.
 */

/**
 * Three textures, and every one of them is reproducible by the element itself.
 *
 * That is the selection rule, not taste. Grain was too fine to survive as a
 * foreground over the noise, and the vignette is a gradient rather than a
 * texture, so neither could be continued INTO the block -- which is the only
 * reason to pair a pattern with this element at all. A pattern the element
 * cannot echo just draws a rectangle around it.
 */
/**
 * Point the page's own texture at the beat's, and phase the element to match.
 *
 * The page layer is position:fixed, so its origin is the viewport and the
 * offsets are simply the element's viewport position -- measured WITHOUT the
 * entrance transform, since the pattern has to line up where the word comes to
 * rest, not where it starts. offsetLeft/offsetTop walk the layout box and
 * ignore transforms, which getBoundingClientRect does not.
 */
function restOffset(el) {
  let x = 0, y = 0;
  for (let n = el; n; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
  return [x, y];
}

function alignPattern(el) {
  const [x, y] = restOffset(el);
  // Custom properties, so this lands without needing a repaint.
  el.style.setProperty('--nocap-pattern-ox', x + 'px');
  el.style.setProperty('--nocap-pattern-oy', y + 'px');
}


start();

// Reports the widest laid-out beat against the viewport, so the fit can be
// checked at a real size rather than inferred from canvas attributes.
addEventListener('load', () => {
  let worst = 0;
  for (const b of beats) {
    const on = b.wrap.classList.contains('on');
    b.wrap.classList.add('on');
    worst = Math.max(worst, b.wrap.getBoundingClientRect().width);
    if (!on) b.wrap.classList.remove('on');
  }
  const el = document.createElement('div');
  el.id = 'fitcheck';
  el.style.display = 'none';
  el.textContent = `widest ${Math.round(worst)} of ${VW} fits ${worst <= VW - 24}`;
  document.body.appendChild(el);
});
</script>
</body>
</html>
